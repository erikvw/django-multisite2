[project]
name = "django-multisite2"
version = "2.1.0"
description = "Serve multiple sites from a single Django application"
readme = { file = "README.rst", content-type = "text/x-rst" }
keywords = ["django", "nginx", "edc", "clinical trials", "research", "data management", "gunicorn", "deployment"]
authors = [
    { name = "Leonid S Shestera", email = "leonid@shestera.ru" },
]
maintainers = [
    { name = "Erik van Widenfelt", email = "ew2789@gmail.com" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
requires-python = '>=3.12'
dependencies = ["tldextract"]

[project.urls]
Homepage = "http://github.com/erikvw/django-multisite2"
Documentation = "http://github.com/erikvw/django-multisite2/blob/develop/README.rst"
Repository = "http://github.com/erikvw/django-multisite2.git"
Changelog = "http://github.com/erikvw/django-multisite2/blob/main/CHANGES"


[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "multisite"
source-exclude = ["bin"]
namespace = false


[tool.ruff]
line-length = 95
indent-width = 4
target-version = "py312"
exclude = ["migrations", ".tox", ".venv"]

[tool.coverage.run]
parallel = false
branch = true
source = ["multisite"]

[tool.coverage.paths]
source = ["multisite"]

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = ["requirements.txt"]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.rstcheck]
ignore_directives = ["toctree", "code-block"]
# rstcheck does not resolve `.. include::` directives, so it cannot see the
# substitutions docs/index.rst pulls in from README.rst. sphinx-build does.
ignore_substitutions = ["pypi"]


[dependency-groups]
docs = [
    "furo>=2025.7.19",
    "sphinx>=8.2.3",
    "sphinx-design>=0.6.1",
    "sphinx-inline-tabs>=2023.4.21",
]
lint = [
    # ruff 0.16 widened the default rule set, see PR discussion
    "ruff>=0.12.5,<0.16",
]

dev = [
    "coverage>=7.10.3",
    "django>=5.2",
    # database drivers, so CI can run the suite against mysql and postgres.
    # `uv run` re-syncs the tox env from these groups, so tox `deps` alone
    # would be clobbered.
    "mysqlclient>=2.2",
    "psycopg[binary]>=3.2",
    "edc-test-settings>=1.1.2",
    "mock>=5.2.0",
    "pluggy>=1.6.0",
    "tox>=4.30.2",
    "tox-uv>=1.28.0",
]


[tool.uv.sources]
django-multisite2 = { workspace = true }
